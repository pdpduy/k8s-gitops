apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/pdpduy/k8s-gitops.git'
    targetRevision: main
    path: gitops/operators/keycloak-operator
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: keycloak-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true