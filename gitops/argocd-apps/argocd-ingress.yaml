apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-ingress
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    cert-manager.io/cluster-issuer: "selfsigned-issuer" # Triggers cert generation
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - argocd.lab.local
    secretName: argocd-tls-cert
  rules:
  - host: argocd.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: argocd-server
            port:
              number: 443