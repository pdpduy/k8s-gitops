apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 51.2.0
    chart: kube-prometheus-stack
    helm:
      values: |
        alertmanager:
          enabled: false
          
        # Shrink Grafana
        grafana:
          adminPassword: "admin"
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.lab.local
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
              
        # Shrink the Operator
        prometheusOperator:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              
        # Shrink Kube-State-Metrics
        kubeStateMetrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi

        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - prometheus.lab.local
          prometheusSpec:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true