apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://prometheus-community.github.io/helm-charts'
    targetRevision: 51.2.0
    chart: kube-prometheus-stack
    helm:
      values: |
        alertmanager:
          enabled: false
        
        # Shrink Grafana
        grafana:
          adminPassword: "admin"
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - grafana.lab.nexusworkspace.cloud
            tls:
              - secretName: grafana-tls-cert
                hosts:
                  - grafana.lab.nexusworkspace.cloud
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
        
        # Shrink the Operator
        prometheusOperator:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
        
        # Shrink Kube-State-Metrics
        kubeStateMetrics:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
        
        prometheus:
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: "letsencrypt-prod"
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            hosts:
              - prometheus.lab.nexusworkspace.cloud
            tls:
              - secretName: prometheus-tls-cert
                hosts:
                  - prometheus.lab.nexusworkspace.cloud
          prometheusSpec:
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true