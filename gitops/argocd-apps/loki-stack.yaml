apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://grafana.github.io/helm-charts'
    targetRevision: 2.9.11
    chart: loki-stack
    helm:
      values: |
        loki:
          isDefault: false
        promtail:
          enabled: true
          config:
            clients:
              - url: http://loki-stack.logging.svc.cluster.local:3100/loki/api/v1/push
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: logging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true