apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shared-postgres
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://charts.bitnami.com/bitnami'
    targetRevision: 16.7.26
    chart: postgresql
    helm:
      values: |
        image:
          registry: public.ecr.aws
          repository: bitnami/postgresql
        auth:
          postgresPassword: supersecretadmin # Use this to create new DBs for other apps later
          username: keycloak
          password: keycloakpassword
          database: keycloak
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: database
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true