apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: keycloak-system

resources:
  - https://github.com/keycloak/keycloak-k8s-resources.git//kubernetes/cluster-wide?ref=25.0.0

patches:
  # Patch WATCH_NAMESPACES to "" for cluster-wide reconciliation
  - target:
      kind: Deployment
      name: keycloak-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: WATCH_NAMESPACES
            value: ""