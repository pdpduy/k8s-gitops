apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
  namespace: iam
stringData:
  username: keycloak
  password: keycloakpassword
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  namespace: iam
spec:
  instances: 1
  db:
    vendor: postgres
    # Updated host service to match Percona PostgreSQL Operator endpoint
    host: "shared-postgres-pgbouncer.database.svc.cluster.local"
    usernameSecret:
      name: keycloak-db-secret
      key: username
    passwordSecret:
      name: keycloak-db-secret
      key: password
  http:
    tlsSecret: keycloak-tls-cert
  hostname:
    hostname: keycloak.lab.nexusworkspace.cloud