apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-keycloak-credentials
  namespace: database
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-kv
  target:
    name: keycloak-db-secret
    creationPolicy: Orphan  # Avoids ownerReference clash with Percona PostgreSQL Operator
    template:
      data:
        password: "{{ .dbpassword }}"
  data:
    - secretKey: dbpassword
      remoteRef:
        key: keycloak-db-password